<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 0;
        }

        h1 {
            background-color: #28a745;
            color: #fff;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        .container {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 80vh;
            text-align: left;
        }

        .product-list {
            width: 50%;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            font-size: 1.2em;
        }

        .product-name {
            color: #333;
            font-weight: bold;
        }

        .product-price {
            color: #28a745;
            font-weight: bold;
        }

        .product-quantity {
            display: flex;
            align-items: center;
        }

        .quantity-btn {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 5px 10px;
            margin: 0 5px;
            cursor: pointer;
            font-size: 1em;
            border-radius: 4px;
        }

        .quantity-btn:hover {
            background-color: #218838;
        }

        .total {
            margin-top: 20px;
            text-align: right;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Корзина</h1>
    <div class="container">
        <div class="product-list">
            {% for product in products %}
            <div class="product-item">
                <span class="product-name">{{ product.name }}</span>
                <span class="product-price">{{ product.price }}₴</span>
                <div class="product-quantity">
                    <button class="quantity-btn" onclick="decreaseQuantity('{{ product.id }}')">-</button>
                    <span>{{ product.quantity }} шт.</span>
                    <button class="quantity-btn" onclick="increaseQuantity('{{ product.id }}')">+</button>
                </div>
            </div>
            {% endfor %}
            <div class="total">Загальна сума {{ total_cost }}₴</div>
        </div>
    </div>

    <script>
        function increaseQuantity(productId) {
            // Логика увеличения количества товара
        }

        function decreaseQuantity(productId) {
            // Логика уменьшения количества товара
        }
    </script>
</body>
</html>
