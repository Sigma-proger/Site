<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Корзина</title>
	<style>
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background-color: #f5f5f5;
			color: #333;
			margin: 0;
			padding: 0;
		}

		.basket {
			background-color: #28a745;
			color: #fff;
			padding: 20px;
			margin: 0;
			text-align: center; /* Центрируем заголовок */
		}

		.container {
			padding: 20px;
			display: flex;
			justify-content: center; /* Центрируем содержимое */
			align-items: center;
			min-height: 80vh; /* Задаем минимальную высоту для центрирования */
			text-align: center; /* Центрируем текст внутри контейнера */
		}

		.product {
			background-color: #fff;
			margin: 10px 0;
			padding: 10px;
			border: 1px solid #ddd;
			border-radius: 4px;
		}
	</style>
</head>
<body>
	<h1 class="basket">Корзина</h1>
	<div class="container">
		<pre><h1>{{ products }}</h1></pre>
	</div>
</body>
</html>
