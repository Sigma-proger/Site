<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Магазин Електроніки</title>
	<style>
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background-color: #f5f5f5;
			color: #333;
			margin: 0;
			padding: 0;
			position: relative;
		}

		h1 {
			background-color: #28a745;
			color: #fff;
			padding: 20px;
			margin: 0;
		}

		.btn-login {
			position: absolute;
			top: 20px;
			right: 20px;
		}

		.btn-login button {
			padding: 10px 15px;
			font-size: 16px;
			background-color: #28a745;
			color: #fff;
			border: none;
			border-radius: 4px;
			cursor: pointer;
		}
		.buy-button {
			background-color: green;
			color: white;
			border: none;
			padding: 10px 20px;
			font-size: 16px;
			cursor: pointer;
			border-radius: 5px;
			margin-top: 10px;
		}
	</style>
</head>

<body>
	<h1>Ласкаво просимо</h1>
	<div class="btn-login">
		<form action="/registration" method="post">
			<button type="submit">Зареєструватися</button>
		</form>
	</div>


</body>
</html>
