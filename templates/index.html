<!DOCTYPE html>
<html lang="uk">
<head>
	<link rel="stylesheet" type="text/css" href="style.css">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SatisForum</title>
</head>

<body>
	<header class="site-header">
		<div class="container">
			<div class="logo">
				<a href="#" onclick="showTopicsView()">
					<canvas id="logoCanvas" width="140" height="32"></canvas>

					<script>
						const canvas = document.getElementById('logoCanvas');
						const ctx = canvas.getContext('2d');

						// Використовуємо 24px за вимогами
						ctx.font = 'bold 24px Inter, sans-serif';
						ctx.textBaseline = 'middle';

						const firstPart = "Satis";
						const secondPart = "Forum";

						// Відступ зліва (margin 8px)
						const startX = 8;
						const centerY = canvas.height / 2; // Точно по центру Canvas (16px)

						// 1. Малюємо "Satis" (колір #4F46E5)
						ctx.fillStyle = '#FA9549';
						ctx.fillText(firstPart, startX, centerY);

						// 2. Дрібний розрахунок ширини першої частини
						const firstPartWidth = ctx.measureText(firstPart).width;

						// 3. Малюємо "Forum" одразу після "Satis"
						ctx.fillStyle = '#1B2234';
						ctx.fillText(secondPart, startX + firstPartWidth, centerY);
					</script>
				</a>
			</div>

			<nav id="navigation">
				<a href="https://satisfactory.wiki.gg/">Wiki</a>
				<a href="#about">Про нас</a>
				<a href="#contacts">Контакти</a>
			</nav>

			<!-- 2. Кнопки входу/реєстрації праворуч -->
			<div id="auth-buttons">
				<a href="/login">Увійти</a>
				<a href="/registration">Реєстрація</a>
			</div>
		</div>
	</header>

	<div id="topics">
		<section class="topic">
			<a href="">Споруди</a>
		</section>
	</div>
</body>
</html>
