	<div id="topics">

	<header class="site-header">
		<div>
			<div class="">

				<div class="logo">
					<a href="#" onclick="showTopicsView()" class="">

						<canvas id="logoCanvas" width="140" height="32"></canvas>

						<script>
							const canvas = document.getElementById('logoCanvas');
							const ctx = canvas.getContext('2d');

							// Використовуємо 24px за вимогами
							ctx.font = 'bold 24px Inter, sans-serif';
							ctx.textBaseline = 'middle';

							const firstPart = "Satis";
							const secondPart = "Forum";

							// Відступ зліва (margin 8px)
							const startX = 8;
							const centerY = canvas.height / 2; // Точно по центру Canvas (16px)

							// 1. Малюємо "Satis" (колір #4F46E5)
							ctx.fillStyle = '#FA9549';
							ctx.fillText(firstPart, startX, centerY);

							// 2. Дрібний розрахунок ширини першої частини
							const firstPartWidth = ctx.measureText(firstPart).width;

							// 3. Малюємо "Forum" одразу після "Satis"
							ctx.fillStyle = '#1B2234';
							ctx.fillText(secondPart, startX + firstPartWidth, centerY);
						</script>
					</a>
				</div>
